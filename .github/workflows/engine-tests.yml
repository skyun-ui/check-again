name: ReminderEngine tests

on:
  push:
    paths: ["ReminderEngine/**", "Package.swift", ".github/workflows/engine-tests.yml"]
  pull_request:
    paths: ["ReminderEngine/**", "Package.swift"]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift 버전
        run: swift --version
      - name: 테스트
        run: swift test
