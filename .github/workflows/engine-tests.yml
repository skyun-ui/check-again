name: ReminderEngine tests

on:
  push:
    paths: ["ReminderEngine/**", ".github/workflows/engine-tests.yml"]
  pull_request:
    paths: ["ReminderEngine/**"]

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ReminderEngine
    steps:
      - uses: actions/checkout@v4
      - name: Swift 버전
        run: swift --version
      - name: 테스트
        run: swift test
